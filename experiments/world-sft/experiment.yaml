slug: world-sft
title: Fine-tuning
order: 3
difficulty: core
tags: [our data, instruction tuning, gpu]
summary: Teach your base model to answer questions instead of continuing text, and measure exactly how much it learned.
description: |
  A pretrained model continues text; an assistant answers a question and stops.
  Supervised fine-tuning closes that gap with demonstrations — here generated from
  the same world, complete with the reasoning steps, so nothing was written by
  hand and nothing was distilled from a larger model.

  Because every answer is checkable, the evaluation is exact: accuracy per task
  family, before and after, on problems the model has never seen. No judge model,
  no win rates, no arguing about what counts as a good answer.

# The prepared models and datasets the step forms offer. Nothing else can be chosen;
# optional: a run needs one on its worker only when it picks it. for: limits an entry
# to those material params.
materials:
  - {key: smol135, name: "SmolLM2-135M", path: models/SmolLM2-135M, kind: model, optional: true, for: [model_material], description: "A 135M base model, small enough to fine-tune in full on one GPU."}
  - {key: smol360, name: "SmolLM2-360M", path: models/SmolLM2-360M, kind: model, optional: true, for: [model_material], description: "A 360M base model."}
  - {key: qwen05, name: "Qwen2.5-0.5B", path: models/Qwen2.5-0.5B, kind: model, optional: true, for: [model_material], description: "A 0.5B base model, strong for its size."}
  - {key: qwen15, name: "Qwen2.5-1.5B", path: models/Qwen2.5-1.5B, kind: model, optional: true, for: [model_material], description: "A 1.5B base model; fine-tuned with a LoRA adapter."}
  - {key: gpt2, name: "GPT-2", path: models/gpt2, kind: model, optional: true, for: [model_material], description: "The 124M GPT-2 and its byte-level BPE tokenizer."}
  - {key: p160, name: "Pythia-160m", path: models/pythia-160m, kind: model, optional: true, for: [model_material], description: "Pythia-160m, fully trained."}
  - {key: alpaca, name: "Alpaca-cleaned", path: datasets/sft/alpaca-cleaned, kind: dataset, optional: true, description: "52k instruction / response pairs. Free-text answers: good demonstrations, poor for exact-match grading."}
  - {key: dolly, name: "Dolly 15k", path: datasets/sft/dolly-15k, kind: dataset, optional: true, description: "15k human-written instruction / response pairs; the context passage is added to the prompt."}
  - {key: gsm8k, name: "GSM8K", path: datasets/rl/gsm8k, kind: dataset, optional: true, description: "Grade-school maths word problems; the number after #### is the answer and the lines above it the worked steps."}

steps:
  - id: data
    title: Data
    summary: Generate demonstrations
    description: |
      Each example is a question and a target. The target can be the bare answer or
      the reasoning steps followed by the answer — that single choice usually moves
      accuracy more than any hyper-parameter on this page, and you can measure it in
      one run each way.

      Only the target is scored. The question is in the context but masked out of
      the loss, so the model learns to answer rather than to write more questions.
    script: steps/step1_data.py
    gpus: 0
    timeout_min: 30
    needs_previous: false
    figures: [{key: examples, label: examples}]
    params:
      - {key: model_source, label: Base model, type: select, default: generated, options: [{value: generated, label: generated — one of your Pretraining runs}, {value: prepared, label: prepared — a model under materials/models}]}
      - {key: base_run, label: Pretraining run (step 3), type: run, experiment: world-pretrain, step: 3, default: null, show_if: {model_source: generated}, help: Required — fine-tuning needs something to fine-tune}
      - {key: model_material, label: Prepared model, type: material, kind: model, formats: [atelier, hf], default: null, show_if: {model_source: prepared}, help: "An Atelier checkpoint (model.pt + tokenizer.json) is fine-tuned in full; a HuggingFace model gets a LoRA adapter"}
      - {key: data_source, label: Demonstrations, type: select, default: generated, options: [{value: generated, label: generated from the world}, {value: prepared, label: prepared — a dataset under materials/datasets}]}
      - {key: data_material, label: Prepared dataset, type: material, kind: dataset, schemas: [qa], default: null, show_if: {data_source: prepared}, help: "JSONL rows with a question (prompt / question / instruction) and an answer (answer / output / response); optional steps. A validation or test file is used for evaluation, otherwise a slice is held out"}
      - {key: examples, label: Demonstrations (at most, for a prepared dataset), type: int, min: 200, max: 200000, step: 200, default: 20000}
      - {key: with_steps, label: Include the reasoning steps in the target, type: bool, default: true, help: A prepared dataset contributes steps only where its rows have them}
      - {key: families, label: Task families, type: multiselect, default: [arith, count, sort, lookup, path, shop, compare, seq], show_if: {data_source: generated}, options: [{value: arith, label: arithmetic}, {value: count, label: counting}, {value: sort, label: sorting}, {value: lookup, label: lookup}, {value: path, label: paths}, {value: shop, label: shopping}, {value: compare, label: comparison}, {value: seq, label: sequences}]}
      - {key: difficulty, label: Difficulty, type: select, default: mixed, show_if: {data_source: generated}, options: [{value: mixed, label: mixed}, {value: "0", label: easiest}, {value: "1", label: easy}, {value: "2", label: medium}, {value: "3", label: hard}]}
      - {key: val_examples, label: Validation examples, type: int, min: 50, max: 5000, step: 50, default: 500}
      - {key: seed, label: Seed, type: int, min: 0, max: 99999, default: 21, show_if: {data_source: generated}}
  - id: baseline
    title: Baseline
    summary: What the base model does before you touch it
    description: |
      The same held-out questions the final step uses, asked of the base model with
      three prompt formats. Prompting alone moves the number a little; that little
      is the part fine-tuning does not deserve credit for. Keep this run open when
      you read step 4.
    script: steps/step2_baseline.py
    gpus: 1
    timeout_min: 60
    figures: [{key: best_baseline, label: baseline}]
    params:
      - {key: n_eval, label: Held-out questions, type: int, min: 50, max: 2000, step: 50, default: 300}
      - {key: max_new_tokens, label: Tokens to generate, type: int, min: 32, max: 512, step: 16, default: 192}
      - {key: formats, label: Prompt formats to try, type: multiselect, default: [bare, system, fewshot], options: [{value: bare, label: the question alone}, {value: system, label: with an instruction}, {value: fewshot, label: two solved examples first}]}
  - id: train
    title: Train
    summary: Fine-tune with the prompt masked out
    description: |
      A short run: a few hundred steps at a learning rate well below pretraining.
      Watch the validation loss and stop when it turns — a small model fine-tuned
      too long forgets how to write sentences and starts answering everything with
      the most common number in the data.
    script: steps/step3_train.py
    gpus: 1
    timeout_min: 180
    figures: [{key: eval_loss, label: val loss}]
    params:
      - {key: epochs, label: Epochs, type: float, min: 0.2, max: 10, step: 0.2, default: 2}
      - {key: lr, label: Learning rate, type: float, min: 0.000001, max: 0.001, step: 0.000001, default: 0.0002}
      - {key: batch_size, label: Examples per step, type: int, min: 4, max: 128, default: 24}
      - {key: warmup, label: Warmup steps, type: int, min: 0, max: 500, default: 20}
      - {key: weight_decay, label: Weight decay, type: float, min: 0, max: 0.3, step: 0.01, default: 0.1}
      - {key: use_system, label: Keep the instruction in the prompt, type: bool, default: true, help: Whatever you choose here, the evaluation does the same}
  - id: eval
    title: Evaluate
    summary: Accuracy per family, before and after
    description: |
      Greedy answers to the held-out questions, graded by exact match. The table
      shows what changed and what did not: a family that stays at zero usually needs
      more demonstrations of that family, not more steps.
    script: steps/step4_eval.py
    gpus: 1
    timeout_min: 90
    figures: [{key: accuracy, label: accuracy}]
    params:
      - {key: n_eval, label: Held-out questions, type: int, min: 50, max: 2000, step: 50, default: 300}
      - {key: max_new_tokens, label: Tokens to generate, type: int, min: 32, max: 512, step: 16, default: 192}
      - {key: temperature, label: Temperature, type: float, min: 0, max: 1.5, step: 0.1, default: 0}

project:
  entry: project/train.py
  run_command: python project/train.py --base <pretrain-run>/model.pt --tokenizer <tokenizer-run>/tokenizer.json
  timeout_min: 240
  interface: |
    `project/train.py` must fine-tune a base model and save `outputs/model.pt`
    (plus the tokenizer path inside the checkpoint, or `outputs/tokenizer.json`).
    Everything else is yours: which families to train on, how many demonstrations,
    whether to include reasoning steps, the prompt format, the schedule, whether to
    freeze the lower layers.

    The grader asks your model 300 generated questions it has never seen and counts
    exact matches, then compares against the base model you started from so that
    improvement, not the base model's luck, is what scores.

grader:
  script: grader/grade.py
  gpus: 1
  timeout_min: 60
  auto_on_submit: true
  score_metric: score

leaderboard:
  metric: accuracy
  higher_is_better: true
