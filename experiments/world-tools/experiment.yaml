slug: world-tools
title: Tool use
order: 14
difficulty: advanced
tags: [our data, agents, gpu]
summary: Give a small model a calculator and a lookup table, teach it to call them, and measure how often it calls the right one with valid arguments.
description: |
  A 30M model cannot multiply three-digit numbers reliably. It can learn to write
  `calc(387 * 24)` and use what comes back, which is the whole idea behind tool use:
  stop asking the model to be a computer and let it drive one.

  Three things are measured separately, because they fail separately: does it decide
  to call a tool, does it call the right one with arguments that parse, and does it
  use the result rather than ignoring it.

  The model can be one of your Fine-tuning runs or one prepared under materials/ (an
  Atelier checkpoint or a HuggingFace model). The questions can be generated, or come
  from a prepared question-and-answer dataset: the traces are then built from its
  rows, calling a tool only where the tool's result is the dataset's own answer.

# The prepared models and datasets the step forms offer. Nothing else can be chosen;
# optional: a run needs one on its worker only when it picks it. for: limits an entry
# to those material params.
materials:
  - {key: smol135i, name: "SmolLM2-135M-Instruct", path: models/SmolLM2-135M-Instruct, kind: model, optional: true, description: "SmolLM2-135M after instruction tuning; asked through its chat template."}
  - {key: smol360i, name: "SmolLM2-360M-Instruct", path: models/SmolLM2-360M-Instruct, kind: model, optional: true, description: "SmolLM2-360M after instruction tuning."}
  - {key: qwen05i, name: "Qwen2.5-0.5B-Instruct", path: models/Qwen2.5-0.5B-Instruct, kind: model, optional: true, description: "Qwen2.5-0.5B after instruction tuning."}
  - {key: gsm8k, name: "GSM8K", path: datasets/rl/gsm8k, kind: dataset, optional: true, description: "Grade-school maths word problems; the number after #### is the answer and the lines above it the worked steps."}

steps:
  - id: tools
    title: Tools
    summary: Define the tools and see where they would help
    description: |
      Three tools: a calculator, a lookup over the world's facts, and a counter.
      The step measures, per task family, how often a tool could give the answer
      directly — families where no tool helps are families where tool training can
      only add noise.
    script: steps/step1_tools.py
    gpus: 1
    timeout_min: 60
    needs_previous: false
    figures: [{key: coverage, label: coverage}]
    params:
      - {key: model_source, label: Model, type: select, default: generated, options: [{value: generated, label: generated — one of your Fine-tuning runs}, {value: prepared, label: prepared — a model under materials/models}]}
      - {key: sft_run, label: Fine-tuning run (step 3), type: run, experiment: world-sft, step: 3, default: null, show_if: {model_source: generated}}
      - {key: model_material, label: Prepared model, type: material, kind: model, formats: [atelier, hf], default: null, show_if: {model_source: prepared}, help: "An Atelier checkpoint (model.pt + tokenizer.json) is fine-tuned in full on the traces; a HuggingFace model gets a LoRA adapter"}
      - {key: lang, label: Language of generated questions, type: select, default: en, show_if: {model_source: prepared}, options: [{value: en, label: English}, {value: ja, label: 日本語}], help: Used when the prepared model has no meta.json naming its language}
      - {key: data_source, label: Questions, type: select, default: generated, options: [{value: generated, label: generated from the world}, {value: prepared, label: prepared — a dataset under materials/datasets}]}
      - {key: data_material, label: Prepared dataset, type: material, kind: dataset, schemas: [qa], default: null, show_if: {data_source: prepared}, help: "Questions with short answers (prompt / question + answer / output). Step 2 turns its training rows into traces — a calc or count call wherever the tool's result is the answer, a plain answer otherwise — and step 4 asks its validation or test rows"}
      - {key: enabled, label: Tools to enable, type: multiselect, default: [calc, lookup, count], options: [{value: calc, label: "calc(expression)"}, {value: lookup, label: "lookup(key)"}, {value: count, label: "count(list)"}]}
      - {key: n_probe, label: Questions to probe, type: int, min: 50, max: 1000, step: 50, default: 300}
      - {key: max_new_tokens, label: Tokens to generate, type: int, min: 32, max: 384, step: 16, default: 192}
  - id: traces
    title: Traces
    summary: Generate demonstrations of calling them
    description: |
      Each demonstration shows the model writing a call, receiving a result, and
      continuing. Because the generator knows every answer, a trace is kept only when
      the tool's output actually leads to the right answer — no incorrect
      demonstrations enter the training set.
    script: steps/step2_traces.py
    own_code: true
    gpus: 0
    timeout_min: 60
    figures: [{key: traces, label: traces}]
    params:
      - {key: n_traces, label: Demonstrations, type: int, min: 500, max: 40000, step: 500, default: 8000}
      - {key: no_tool_share, label: Share showing no tool call, type: float, min: 0, max: 0.6, step: 0.05, default: 0.25, help: "Without these the model calls a tool for everything, including questions that need none"}
      - {key: seed, label: Seed, type: int, min: 0, max: 99999, default: 33, help: For a prepared dataset it only shuffles the rows}
  - id: train
    title: Train
    summary: Fine-tune on the traces
    description: |
      Ordinary supervised fine-tuning, with one difference: the tool's returned
      result is in the context but masked out of the loss. The model is learning to
      write calls and to use results, not to predict what the calculator will say.
    script: steps/step3_train.py
    own_code: true
    gpus: 1
    timeout_min: 180
    figures: [{key: eval_loss, label: val loss}]
    params:
      - {key: epochs, label: Epochs, type: float, min: 0.5, max: 8, step: 0.5, default: 3}
      - {key: lr, label: Learning rate, type: float, min: 0.00001, max: 0.001, step: 0.00001, default: 0.0002}
      - {key: batch_size, label: Examples per step, type: int, min: 4, max: 64, default: 24}
  - id: eval
    title: Evaluate
    summary: Called, parsed, used
    description: |
      Accuracy with tools against accuracy without, then the three failure modes
      separately: never calling, calling with arguments that do not parse, and
      calling correctly then ignoring the answer. The last is the most common and the
      easiest to miss if you only look at the final score.
    script: steps/step4_eval.py
    own_code: true
    gpus: 1
    timeout_min: 120
    figures: [{key: accuracy, label: accuracy}, {key: valid_calls, label: valid}]
    params:
      - {key: n_eval, label: Held-out questions, type: int, min: 50, max: 1000, step: 50, default: 300}
      - {key: max_turns, label: Tool calls allowed per question, type: int, min: 1, max: 5, default: 2}
      - {key: max_new_tokens, label: Tokens per turn, type: int, min: 32, max: 256, step: 16, default: 128}

project:
  entry: project/tools.py
  run_command: python project/train.py --model <sft-run>/model.pt --tokenizer <tok.json>
  timeout_min: 240
  interface: |
    `project/tools.py` defines `TOOLS`, a dict of name to callable, and
    `render(name, args, result) -> str` controlling how a call and its result appear
    in the context. `project/train.py` generates traces and trains.

    The grader runs your model through its own tool loop on unseen questions and
    scores accuracy, the share of calls whose arguments parse, and how often the
    result is used. Adding a tool that answers the questions directly is not
    forbidden and will be visible in the call log.

grader:
  script: grader/grade.py
  gpus: 1
  timeout_min: 60
  auto_on_submit: true
  score_metric: score

leaderboard:
  metric: accuracy
  higher_is_better: true
