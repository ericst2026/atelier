# Same as nginx.conf without the Grafana routes (the laptop stack has no Grafana).
server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;
    root /usr/share/nginx/html;
    index index.html;

    # api looked up per request, not once at startup: see nginx.conf
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    proxy_redirect http://api:8000/ /;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /metrics { proxy_pass $api_upstream; }

    location / { try_files $uri $uri/ /index.html; }
}
