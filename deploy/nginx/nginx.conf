# Single entry point for the classroom: the React build, the API, websockets and Grafana.
server {
    listen 80;
    server_name _;
    client_max_body_size 4096m;   # project uploads
    root /usr/share/nginx/html;
    index index.html;

    # Look the upstreams up per request through Docker's DNS instead of once at
    # startup. With a fixed "proxy_pass http://api:8000" nginx keeps the address the
    # api container had when nginx started; recreate api (a rebuild, a changed mount)
    # and it comes back on a new address while nginx keeps sending to the old one,
    # answering every /api and /ws request with 502. It also means nginx starts when
    # grafana is not running (the dashboards profile is off). Because proxy_pass uses
    # a variable, it passes the request URI through unchanged — so no URI part below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $grafana_upstream http://grafana:3000;
    # proxy_redirect's automatic rewrite is off when proxy_pass is a variable, so a
    # redirect from a backend would otherwise point the browser at http://api:8000/...
    proxy_redirect http://api:8000/ /;
    proxy_redirect http://grafana:3000/ /;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed assets from the Vite build
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;       # zip downloads of large projects
        proxy_request_buffering off;   # stream uploads straight through
    }

    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;     # displays stay connected all day
        proxy_send_timeout 86400s;
    }

    location /metrics {
        proxy_pass $api_upstream;
    }

    location /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /grafana/api/live/ {
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # client-side routing (/, /experiments/..., /display/3, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
