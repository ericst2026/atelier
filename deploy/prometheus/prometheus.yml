global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # GPU + platform metrics exported by the Atelier API (NVML)
  - job_name: atelier
    static_configs:
      - targets: ["api:8000"]

  # CPU, memory, disk, network of the node
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
