# Everything the course can download, grouped by the experiment that needs it.
#
#   python scripts/offline/fetch-materials.py --plan            # sizes, nothing downloaded
#   python scripts/offline/fetch-materials.py --tracks core     # the usual class set (~14 GB)
#   python scripts/offline/fetch-materials.py                   # everything (~34 GB)
#   python scripts/offline/fetch-materials.py --groups rag eval
#
# tracks:  core      what most classes need
#          extended  the electives: long context, tool use, interpretability, safety
#          large     the 1.5B models and the bigger corpora; skip on a small disk
#
# Every model here is under 1.5B parameters and permissively licensed. Datasets
# marked non-commercial are fine for teaching; check before any other use.

models:
  # --- tokenizers and classic baselines -------------------------------------
  - {repo: gpt2, name: gpt2, track: core, size_gb: 0.6, why: "reference BPE tokenizer; the baseline for pretraining comparisons"}
  - {repo: distilgpt2, name: distilgpt2, track: core, size_gb: 0.4, why: "a distilled GPT-2, the reference point for the distillation step"}

  # --- the small-model family used across adaptation and capability ---------
  - {repo: HuggingFaceTB/SmolLM2-135M, name: SmolLM2-135M, track: core, size_gb: 0.3, why: "smallest usable base model; fine-tunes on one GPU in minutes"}
  - {repo: HuggingFaceTB/SmolLM2-135M-Instruct, name: SmolLM2-135M-Instruct, track: core, size_gb: 0.3, why: "its instruct counterpart, for before-and-after comparisons"}
  - {repo: HuggingFaceTB/SmolLM2-360M, name: SmolLM2-360M, track: core, size_gb: 0.8, why: "the step up; shows what 2.5x parameters buys"}
  - {repo: HuggingFaceTB/SmolLM2-360M-Instruct, name: SmolLM2-360M-Instruct, track: core, size_gb: 0.8}
  - {repo: Qwen/Qwen2.5-0.5B, name: Qwen2.5-0.5B, track: core, size_gb: 1.0, why: "the main SFT / DPO / GRPO base model"}
  - {repo: Qwen/Qwen2.5-0.5B-Instruct, name: Qwen2.5-0.5B-Instruct, track: core, size_gb: 1.0, why: "starting policy for reinforcement learning and reasoning"}
  - {repo: Qwen/Qwen2.5-1.5B, name: Qwen2.5-1.5B, track: large, size_gb: 3.1}
  - {repo: Qwen/Qwen2.5-1.5B-Instruct, name: Qwen2.5-1.5B-Instruct, track: large, size_gb: 3.1, why: "judge model, distillation teacher, and the stronger solver"}
  - {repo: Qwen/Qwen2.5-Coder-0.5B, name: Qwen2.5-Coder-0.5B, track: extended, size_gb: 1.0, why: "code generation and the code evaluation tasks"}

  # --- a scaling suite: the same recipe at five sizes ------------------------
  - {repo: EleutherAI/pythia-70m, name: pythia-70m, track: core, size_gb: 0.2, why: "scaling-law sweep: five sizes trained identically on the same data"}
  - {repo: EleutherAI/pythia-160m, name: pythia-160m, track: core, size_gb: 0.4}
  - {repo: EleutherAI/pythia-410m, name: pythia-410m, track: core, size_gb: 1.0}
  - {repo: EleutherAI/pythia-1b, name: pythia-1b, track: large, size_gb: 2.1}
  # intermediate training checkpoints of one model: training dynamics without training
  - {repo: EleutherAI/pythia-160m, name: pythia-160m-step1000, revision: step1000, track: extended, size_gb: 0.4, why: "watch a model mid-training: step 1k, 16k, 64k of the same run"}
  - {repo: EleutherAI/pythia-160m, name: pythia-160m-step16000, revision: step16000, track: extended, size_gb: 0.4}
  - {repo: EleutherAI/pythia-160m, name: pythia-160m-step64000, revision: step64000, track: extended, size_gb: 0.4}

  # --- retrieval ------------------------------------------------------------
  - {repo: sentence-transformers/all-MiniLM-L6-v2, name: all-MiniLM-L6-v2, track: core, size_gb: 0.1, why: "sentence embeddings for the retrieval experiment"}
  - {repo: BAAI/bge-small-en-v1.5, name: bge-small-en-v1.5, track: core, size_gb: 0.14, why: "a stronger embedder to compare against"}
  - {repo: cross-encoder/ms-marco-MiniLM-L-6-v2, name: ms-marco-MiniLM-L-6-v2, track: core, size_gb: 0.1, why: "reranker: the second stage of retrieval"}

  # --- classifiers used as tools, not as the subject ------------------------
  - {repo: HuggingFaceFW/fineweb-edu-classifier, name: fineweb-edu-classifier, track: extended, size_gb: 0.6, why: "quality scoring in the data-curation experiment"}
  - {repo: distilbert/distilbert-base-uncased, name: distilbert-base-uncased, track: extended, size_gb: 0.3, why: "probing and interpretability"}

datasets:
  # --- tokenizer and data curation ------------------------------------------
  - {repo: Salesforce/wikitext, config: wikitext-103-raw-v1, group: tokenizer, name: wikitext-103-raw, track: core, size_gb: 0.2, splits: {train: train, test: test}, limit: 80000, fields: {text: text}}
  - {repo: bigcode/the-stack-smol, group: tokenizer, name: code, track: core, size_gb: 0.1, splits: {train: train}, limit: 8000, fields: {text: content, lang: lang}}
  - {repo: statmt/cc100, config: ja, group: tokenizer, name: multilingual, track: core, size_gb: 0.1, splits: {train: train}, limit: 30000, fields: {text: text}, optional: true, why: "a non-space-separated language; the case where whitespace tokenizers fail"}
  - {repo: HuggingFaceFW/fineweb-edu, config: sample-10BT, group: curation, name: fineweb-edu, track: core, size_gb: 1.2, splits: {train: train}, limit: 150000, fields: {text: text, score: score, url: url}, why: "web text with quality scores already attached: the target of curation"}
  - {repo: allenai/c4, config: en, group: curation, name: c4-raw, track: core, size_gb: 1.0, splits: {train: train}, limit: 150000, fields: {text: text, url: url}, why: "the same web, uncurated — students build the filter that separates them"}

  # --- pretraining ----------------------------------------------------------
  - {repo: roneneldan/TinyStories, group: pretrain, name: tinystories, track: core, size_gb: 0.5, splits: {train: train, validation: validation}, limit: 500000, fields: {text: text}}
  - {repo: Salesforce/wikitext, config: wikitext-103-raw-v1, group: pretrain, name: wikitext-103, track: core, size_gb: 0.5, splits: {train: train, validation: validation}, limit: 400000, fields: {text: text}}
  - {repo: HuggingFaceTB/cosmopedia-v2, group: pretrain, name: cosmopedia, track: large, size_gb: 1.5, splits: {train: train}, limit: 200000, fields: {text: text}, optional: true, why: "synthetic textbook-style text; a third domain for the mixing experiment"}

  # --- supervised fine-tuning ------------------------------------------------
  - {repo: yahma/alpaca-cleaned, group: sft, name: alpaca-cleaned, track: core, size_gb: 0.05, splits: {train: train}, fields: {instruction: instruction, input: input, output: output}, license: "CC BY-NC 4.0 — teaching only"}
  - {repo: databricks/databricks-dolly-15k, group: sft, name: dolly-15k, track: core, size_gb: 0.02, splits: {train: train}, fields: {instruction: instruction, context: context, response: response, category: category}}
  - {repo: HuggingFaceTB/smoltalk, config: all, group: sft, name: smoltalk, track: core, size_gb: 0.3, splits: {train: train}, limit: 40000, fields: {messages: messages}}
  - {repo: HuggingFaceH4/no_robots, group: sft, name: no-robots, track: core, size_gb: 0.02, splits: {train: train, test: test}, fields: {messages: messages, category: category}, why: "10k entirely human-written demonstrations; the quality ceiling to compare against"}

  # --- preference optimisation (DPO) and RLHF --------------------------------
  - {repo: HuggingFaceH4/ultrafeedback_binarized, group: preference, name: ultrafeedback, track: core, size_gb: 0.5, splits: {train: train_prefs, test: test_prefs}, limit: 40000, fields: {prompt: prompt, chosen: chosen, rejected: rejected}}
  - {repo: Anthropic/hh-rlhf, group: preference, name: hh-rlhf, track: core, size_gb: 0.15, splits: {train: train, test: test}, limit: 50000, fields: {chosen: chosen, rejected: rejected}}
  - {repo: Intel/orca_dpo_pairs, group: preference, name: orca-dpo, track: extended, size_gb: 0.05, splits: {train: train}, limit: 12000, fields: {question: question, chosen: chosen, rejected: rejected}}

  # --- reinforcement learning and reasoning ----------------------------------
  - {repo: openai/gsm8k, config: main, group: rl, name: gsm8k, track: core, size_gb: 0.01, splits: {train: train, test: test}, fields: {question: question, answer: answer}}
  - {repo: HuggingFaceH4/MATH-500, group: reasoning, name: math-500, track: core, size_gb: 0.01, splits: {test: test}, fields: {problem: problem, solution: solution, answer: answer, level: level}}
  - {repo: deepmind/aqua_rat, config: raw, group: reasoning, name: aqua-rat, track: extended, size_gb: 0.02, splits: {train: train, test: test}, limit: 20000, fields: {question: question, options: options, rationale: rationale, correct: correct}, optional: true}

  # --- evaluation harness ----------------------------------------------------
  - {repo: Rowan/hellaswag, group: eval, name: hellaswag, track: core, size_gb: 0.05, splits: {validation: validation}, fields: {ctx: ctx, endings: endings, label: label}}
  - {repo: allenai/ai2_arc, config: ARC-Easy, group: eval, name: arc-easy, track: core, size_gb: 0.01, splits: {test: test}, fields: {question: question, choices: choices, answerKey: answerKey}}
  - {repo: allenai/ai2_arc, config: ARC-Challenge, group: eval, name: arc-challenge, track: core, size_gb: 0.01, splits: {test: test}, fields: {question: question, choices: choices, answerKey: answerKey}}
  - {repo: ybisk/piqa, group: eval, name: piqa, track: core, size_gb: 0.01, splits: {validation: validation}, fields: {goal: goal, sol1: sol1, sol2: sol2, label: label}, optional: true}
  - {repo: allenai/winogrande, config: winogrande_xs, group: eval, name: winogrande, track: core, size_gb: 0.01, splits: {validation: validation}, fields: {sentence: sentence, option1: option1, option2: option2, answer: answer}, optional: true}
  - {repo: cais/mmlu, config: all, group: eval, name: mmlu, track: core, size_gb: 0.15, splits: {test: test, dev: dev}, fields: {question: question, choices: choices, answer: answer, subject: subject}}
  - {repo: truthfulqa/truthful_qa, config: multiple_choice, group: eval, name: truthfulqa, track: extended, size_gb: 0.01, splits: {validation: validation}, fields: {question: question, mc1_targets: mc1_targets}}
  - {repo: openai/openai_humaneval, group: eval, name: humaneval, track: extended, size_gb: 0.01, splits: {test: test}, fields: {task_id: task_id, prompt: prompt, canonical_solution: canonical_solution, test: test, entry_point: entry_point}}
  - {repo: google-research-datasets/mbpp, config: sanitized, group: eval, name: mbpp, track: extended, size_gb: 0.01, splits: {test: test, train: train}, fields: {task_id: task_id, prompt: prompt, code: code, test_list: test_list}}

  # --- retrieval -------------------------------------------------------------
  - {repo: rajpurkar/squad_v2, group: rag, name: squad-v2, track: core, size_gb: 0.1, splits: {train: train, validation: validation}, limit: 60000, fields: {question: question, context: context, answers: answers, id: id}, why: "questions with the paragraph that answers them: the ground truth for retrieval"}
  - {repo: hotpotqa/hotpot_qa, config: distractor, group: rag, name: hotpotqa, track: core, size_gb: 0.3, splits: {validation: validation}, limit: 7500, fields: {question: question, answer: answer, context: context, supporting_facts: supporting_facts}, why: "multi-hop: one retrieval is not enough"}
  - {repo: wikimedia/wikipedia, config: 20231101.simple, group: rag, name: wikipedia-simple, track: core, size_gb: 0.5, splits: {train: train}, limit: 120000, fields: {title: title, text: text}, why: "the corpus to index and search"}

  # --- tool use and agents ---------------------------------------------------
  - {repo: glaiveai/glaive-function-calling-v2, group: tools, name: glaive-function-calling, track: extended, size_gb: 0.3, splits: {train: train}, limit: 20000, fields: {system: system, chat: chat}, optional: true, why: "function-calling traces to fine-tune on"}

  # --- long context ----------------------------------------------------------
  - {repo: deepmind/narrativeqa, group: longcontext, name: narrativeqa, track: extended, size_gb: 0.4, splits: {validation: validation}, limit: 3000, fields: {document: document, question: question, answers: answers}, optional: true, why: "documents long enough to break a 2k context window"}

  # --- safety ----------------------------------------------------------------
  - {repo: PKU-Alignment/PKU-SafeRLHF, group: safety, name: pku-saferlhf, track: extended, size_gb: 0.2, splits: {train: train, test: test}, limit: 30000, fields: {prompt: prompt, response_0: response_0, response_1: response_1, safer_response_id: safer_response_id}, optional: true, why: "prompts paired by which response is safer: refusal training and its evaluation"}
  - {repo: allenai/real-toxicity-prompts, group: safety, name: toxicity-prompts, track: extended, size_gb: 0.1, splits: {train: train}, limit: 20000, fields: {prompt: prompt, challenging: challenging}, optional: true, why: "a standard set for measuring how often a model continues badly"}
